spring.application.name=pasteleria-backend
server.port=8080

# ---------- Base de datos MySQL ----------
# createDatabaseIfNotExist=true: si la base no existe, MySQL la crea sola
spring.datasource.url=jdbc:mysql://localhost:3306/pasteleria_mil_sabores?createDatabaseIfNotExist=true&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=

# update: Hibernate crea y actualiza las tablas a partir de las clases @Entity, sin borrar los datos
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ---------- JWT ----------
# Clave para firmar los tokens (mínimo 32 caracteres). En producción iría en una variable de entorno.
jwt.secreto=MilSabores-ClaveSecreta-Para-Firmar-Tokens-DSY1104-2026
jwt.minutos-acceso=30
jwt.dias-renovacion=7

# ---------- CORS ----------
# Direcciones del frontend (Vite) que pueden llamar a la API
app.cors.origenes=http://localhost:5173,http://localhost:4173
